# FortiGate (Site C) — SD-WAN / IPsec / SSL-VPN excerpt, SANITIZED
# Source: FortiOS 7.2 full-config export, 2026-11-01. Curated: only design-relevant
# sections kept (defaults, certificates, UTM catalogues, address/VIP lists dropped).
# All public IPs -> 203.0.113.0/24 (TEST-NET-3); LAN 10.30.0.0/24; secrets <REDACTED>;
# people / ISP / partner names replaced. Published with the site owner's permission.

config system interface
    edit "dmz"
        set ip 10.0.31.1 255.255.255.0
        set allowaccess ping https fgfm fabric
        set type physical
        set role dmz
    next
    edit "mgmt"
        set ip 10.0.1.99 255.255.255.0
        set allowaccess ping https ssh fgfm
        set type physical
        set role lan
    next
    edit "wan1"
        set ip 203.0.113.10 255.255.255.252
        set allowaccess ping https http
        set type physical
        set alias "ISP3"
        set role wan
    next
    edit "wan2"
        set mode dhcp
        set allowaccess ping fgfm
        set type physical
        set role wan
    next
    edit "port13"
        set ip 203.0.113.12 255.255.255.254
        set allowaccess ping
        set type physical
        set alias "ISP1"
        set role wan
    next
    edit "port14"
        set ip 203.0.113.14 255.255.255.255
        set allowaccess ping
        set type physical
        set alias "ISP2"
        set role wan
    next
    edit "lan"
        set ip 10.30.0.254 255.255.255.0
        set allowaccess ping https ssh http fgfm fabric
        set type hard-switch
        set role lan
            edit 1
                set ip 10.16.0.2 255.255.255.0
                set allowaccess ping https ssh http fgfm fabric
            next
    next
end

config system sdwan
    set status enable
    config zone
        edit "virtual-wan-link"
        next
        edit "SD-WAN"
        next
    end
    config members
        edit 1
            set interface "port14"
            set zone "SD-WAN"
            set gateway 203.0.113.16
        next
        edit 2
            set interface "port13"
            set zone "SD-WAN"
            set gateway 203.0.113.18
        next
        edit 3
            set interface "wan1"
            set zone "SD-WAN"
            set gateway 203.0.113.20
        next
    end
    config health-check
        edit "Default_DNS"
            set system-dns enable
            set interval 1000
            set probe-timeout 1000
            set recoverytime 10
            config sla
                edit 1
                    set latency-threshold 250
                    set jitter-threshold 50
                    set packetloss-threshold 5
                next
            end
        next
        edit "Default_Office_365"
            set server "www.office.com"
            set protocol http
            set interval 1000
            set probe-timeout 1000
            set recoverytime 10
            config sla
                edit 1
                    set latency-threshold 250
                    set jitter-threshold 50
                    set packetloss-threshold 5
                next
            end
        next
        edit "Default_Gmail"
            set server "gmail.com"
            set interval 1000
            set probe-timeout 1000
            set recoverytime 10
            config sla
                edit 1
                    set latency-threshold 250
                    set jitter-threshold 50
                    set packetloss-threshold 2
                next
            end
        next
        edit "Default_AWS"
            set server "aws.amazon.com"
            set protocol http
            set interval 1000
            set probe-timeout 1000
            set recoverytime 10
            config sla
                edit 1
                    set latency-threshold 250
                    set jitter-threshold 50
                    set packetloss-threshold 5
                next
            end
        next
        edit "Default_Google Search"
            set server "www.google.com"
            set protocol http
            set interval 1000
            set probe-timeout 1000
            set recoverytime 10
            config sla
                edit 1
                    set latency-threshold 250
                    set jitter-threshold 50
                    set packetloss-threshold 5
                next
            end
        next
        edit "Default_FortiGuard"
            set server "fortiguard.com"
            set protocol http
            set interval 1000
            set probe-timeout 1000
            set recoverytime 10
            config sla
                edit 1
                    set latency-threshold 250
                    set jitter-threshold 50
                    set packetloss-threshold 5
                next
            end
        next
    end
    config service
        edit 3
            set name "ISP2"
            set dst "all"
            set src "236" "150" "gameip" "wifi"
            set priority-members 1
        next
        edit 1
            set name "ISP1"
            set dst "all"
            set src "188" "226" "user1pc"
            set priority-members 2
        next
        edit 2
            set name "ISP3"
            set dst "all"
            set priority-members 3
        next
    end
end

config router static
    edit 1
        set distance 1
        set sdwan-zone "SD-WAN"
    next
    edit 2
        set dst 10.50.2.0 255.255.255.0
        set device "partner"
    next
    edit 3
        set dst 10.50.20.0 255.255.255.0
        set device "partner"
    next
end

config vpn ipsec phase1-interface
    edit "partner"
        set interface "port13"
        set ike-version 2
        set keylife 3600
        set peertype any
        set net-device disable
        set proposal aes256-sha256
        set localid <REDACTED>
        set dpd on-idle
        set dhgrp 14
        set remote-gw 203.0.113.22
        set psksecret <REDACTED>
        set dpd-retryinterval 5
    next
end

config vpn ipsec phase2-interface
    edit "partner_test"
        set phase1name "partner"
        set proposal aes256-sha256
        set auto-negotiate enable
        set keylifeseconds 3600
        set src-subnet 10.30.0.236 255.255.255.255
        set dst-subnet 10.50.2.0 255.255.255.0
    next
    edit "partner_prod"
        set phase1name "partner"
        set proposal aes128-sha1 aes256-sha1 aes128-sha256 aes256-sha256 aes128gcm aes256gcm chacha20poly1305
        set src-subnet 10.30.0.237 255.255.255.255
        set dst-subnet 10.50.20.0 255.255.255.0
    next
end

config vpn ssl settings
    set servercert "Fortinet_Factory"
    set tunnel-ip-pools "SSLVPN_TUNNEL_ADDR1"
    set tunnel-ipv6-pools "SSLVPN_TUNNEL_IPv6_ADDR1"
    set port <SSLVPN_PORT>
    set source-interface "wan1"
    set source-address "all"
    set source-address6 "all"
    set default-portal "full-access"
    config authentication-rule
        edit 1
            set users "user1"
            set groups "SSL-VPN"
            set portal "full-access"
        next
    end
end

config firewall policy
    edit 5
        set name "from all"
        set srcintf "SD-WAN"
        set dstintf "lan"
        set action accept
        set srcaddr "all"
        set dstaddr "INBOUND-PORT-FORWARDS"  # VIP list removed (attack surface)
        set schedule "always"
        set service "ALL"
        set comments " (Copy of port forwading)"
    next
    edit 1
        set name "lan to wan"
        set srcintf "lan"
        set dstintf "SD-WAN"
        set action accept
        set srcaddr "all"
        set dstaddr "all"
        set schedule "always"
        set service "ALL"
        set nat enable
    next
    edit 6
        set name "partner_to_local"
        set srcintf "partner"
        set dstintf "lan"
        set action accept
        set srcaddr "partner_test" "partner_prod"
        set dstaddr "236_partner_test" "237_partner_prod"
        set schedule "always"
        set service "ALL"
    next
    edit 2
        set name "port_forwading"
        set srcintf "SD-WAN"
        set dstintf "lan"
        set action accept
        set srcaddr "ALLOWED-REMOTE-SOURCES"  # list of trusted public IPs removed
        set dstaddr "INBOUND-PORT-FORWARDS"  # VIP list removed (attack surface)
        set schedule "always"
        set service "ALL"
    next
    edit 3
        set name "SSLVPN To LAN"
        set srcintf "ssl.root"
        set dstintf "lan"
        set action accept
        set srcaddr "all"
        set dstaddr "all"
        set schedule "always"
        set service "ALL"
        set groups "SSL-VPN"
        set users "user1"
    next
    edit 4
        set name "SSLVPN To WAN"
        set srcintf "ssl.root"
        set dstintf "SD-WAN"
        set action accept
        set srcaddr "all"
        set dstaddr "all"
        set schedule "always"
        set service "ALL"
        set nat enable
        set groups "SSL-VPN"
        set users "user1"
        set comments " (Copy of SSLVPN To LAN) (Reverse of SSLVPN To LAN)"
    next
end
